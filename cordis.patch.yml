# @dsh-kit/agent-memory bundle layer — applied when a profile lists this bundle
# (package.json declares `dsh.bundle.patch` pointing at this file).
#
# `name` is a PACKAGE NAME (resolved through the profile's node_modules or the
# installation fallback $DSH_HOME/profiles/node_modules), NOT a relative path.
# Mount this plugin near the top of the profile composition so `ctx.memory`
# is visible to every descendant plugin that injects `['memory']`.
- insert:
    - id: agent-memory
      name: '@dsh-kit/agent-memory'
